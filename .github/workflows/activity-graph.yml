name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: tahiry-dev-29
          options: theme=github-compact&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.PORTFOLIO_GH_TOKEN }}

      - name: Save graph
        run: |
          mkdir -p assets
          cp dist/activity-graph.svg assets/activity-graph.svg

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update activity graph"
          git push
